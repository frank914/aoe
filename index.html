<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AOE2 房轉換器</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    input {
      font-size: 1.2em;
      padding: 6px;
      width: 100%;
      max-width: 500px;
    }
    button {
      padding: 8px 16px;
      font-size: 1em;
      margin-top: 10px;
    }
    .links {
      margin-top: 20px;
      font-size: 1.1em;
      padding: 10px;
      border-radius: 6px;
      background: #f9f9f9;
      border: 1px solid #ddd;
      font-family: monospace;
      word-break: break-all;
    }
    a {
      display: block;
      margin: 5px 0;
      color: #0645AD;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>AOE2 房號連結轉換器</h1>
  <p>請輸入協定連結（如 <code>aoe2de://0/407499724</code> 或 <code>aoe2de://1/407499724</code>）：</p>

  <input type="text" id="aoeInput" placeholder="貼上 aoe2de:// 開頭的連結" />
  <button onclick="convert()">產生 GitHub 跳轉連結</button>

  <div class="links" id="result" style="display:none;">
    <strong>自動跳轉網址：</strong>
    <a id="linkJoin" href="#" target="_blank"></a>
    <a id="linkSpectate" href="#" target="_blank"></a>
  </div>

  <script>
    function convert() {
      const input = document.getElementById("aoeInput").value.trim();
      const match = input.match(/^aoe2de:\/\/[01]\/(\d+)$/);
      if (!match) {
        alert("請輸入正確格式，例如 aoe2de://0/123456");
        return;
      }

      const number = match[1];
      const base = "https://frank914.github.io/autoCovert";

      const urlJoin = `${base}/?number=${number}&mode=join`;
      const urlSpectate = `${base}/?number=${number}&mode=spectate`;

      const linkJoin = document.getElementById("linkJoin");
      const linkSpectate = document.getElementById("linkSpectate");

      linkJoin.href = urlJoin;
      linkJoin.textContent = urlJoin;

      linkSpectate.href = urlSpectate;
      linkSpectate.textContent = urlSpectate;

      document.getElementById("result").style.display = "block";
    }
  </script>
</body>
</html>
